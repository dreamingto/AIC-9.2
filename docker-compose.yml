services:
  db:
    build:
      context: ./backend/docker/db
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-public.ecr.aws/docker/library/postgres:16}
        PGVECTOR_PACKAGE_VERSION: ${PGVECTOR_PACKAGE_VERSION:-0.8.6-1.pgdg13+1}
    image: tuji-pgvector:pg16-v0.8.6
    environment:
      POSTGRES_USER: tuji
      POSTGRES_PASSWORD: tuji
      POSTGRES_DB: tuji
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuji -d tuji"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tuji:tuji@db:5432/tuji
      SYNC_DATABASE_URL: postgresql+psycopg://tuji:tuji@db:5432/tuji
      DATA_ROOT: /app/data
      MANIFEST_ROOT: /app/data/manifests
      ASSET_ROOT: /app/data/assets
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres-data:
