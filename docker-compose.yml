services:
  db:
    build:
      context: ./backend/docker/db
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-public.ecr.aws/docker/library/postgres:16}
        PGVECTOR_PACKAGE_VERSION: ${PGVECTOR_PACKAGE_VERSION:-0.8.6-1.pgdg13+1}
    image: tuji-pgvector:pg16-v0.8.6
    environment:
      POSTGRES_USER: tuji
      POSTGRES_PASSWORD: tuji
      POSTGRES_DB: tuji
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuji -d tuji"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://tuji:tuji@db:5432/tuji
      SYNC_DATABASE_URL: postgresql+psycopg://tuji:tuji@db:5432/tuji
      DATA_ROOT: /app/data
      MANIFEST_ROOT: /app/data/manifests
      ASSET_ROOT: /app/data/assets
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data/manifests:/app/data/manifests:ro
      - ./backend/data/assets/fixture_v1:/app/data/assets/fixture_v1:ro
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
        required: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
