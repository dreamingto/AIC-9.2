name: quality
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tuji
          POSTGRES_PASSWORD: tuji
          POSTGRES_DB: tuji_reviewed_real_test
        ports: ['55432:5432']
        options: >-
          --health-cmd 'pg_isready -U tuji -d tuji_reviewed_real_test'
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TUJI_TEST_DATABASE_URL: postgresql+asyncpg://tuji:tuji@127.0.0.1:55432/tuji_reviewed_real_test
      SYNC_DATABASE_URL: postgresql+psycopg://tuji:tuji@127.0.0.1:55432/tuji_reviewed_real_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
      - run: python -m compileall -q app scripts tests model_runtime
      - run: ruff check app scripts tests model_runtime
      - run: mypy app scripts
      - run: alembic upgrade head
      - run: pytest -q
      - run: python -m scripts.export_openapi --output ../frontend/src/types/openapi.json
      - run: git diff --exit-code -- ../frontend/src/types/openapi.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
